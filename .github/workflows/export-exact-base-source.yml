name: Export Exact PenC Base Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-exact-base-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct exact base source from Git objects
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TREE: 59a5d2606ad214dcea9ccee3b86d85460c82435a
          OLD_SHA256: fea40c9e2cc88063c02397904a7f2401577b488f7682e03022e73f48b8f5fe44
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'penc-export-exact-base',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          tree = get_json(f"https://api.github.com/repos/{repo}/git/trees/{os.environ['SOURCE_TREE']}?recursive=1")
          blobs = {x['path']: x['sha'] for x in tree['tree'] if x.get('type') == 'blob'}
          names = ['src/source_payload.b64'] + [f'src/cont{i:03}.b64' for i in range(14)]
          pieces = []
          for name in names:
              if name not in blobs:
                  raise SystemExit(f'Missing base-source object: {name}')
              obj = get_json(f"https://api.github.com/repos/{repo}/git/blobs/{blobs[name]}")
              pieces.append(base64.b64decode(obj['content']).decode('ascii').strip())

          source = lzma.decompress(base64.b64decode(''.join(pieces)))
          sha = hashlib.sha256(source).hexdigest()
          print('BASE SIZE:', len(source))
          print('BASE SHA256:', sha)
          if sha != os.environ['OLD_SHA256']:
              raise SystemExit(f'Base source SHA mismatch: {sha}')

          Path('PenC_Expansion_Editor_BASE_EXACT.py').write_bytes(source)
          PY

          python -m py_compile PenC_Expansion_Editor_BASE_EXACT.py

      - name: Upload exact base source
        uses: actions/upload-artifact@v4
        with:
          name: PenC_Expansion_Editor_BASE_EXACT
          path: PenC_Expansion_Editor_BASE_EXACT.py
          if-no-files-found: error
          retention-days: 1
