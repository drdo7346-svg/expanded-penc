name: Export Existing PenC Source

on:
  push:
    paths:
      - '.github/workflows/export-existing-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final editor payload branch
        uses: actions/checkout@v4
        with:
          ref: build-final-editor-v9
      - name: Inspect valid delta prefix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          files=sorted(Path('delta_parts').glob('part*.b64'))
          good=[]
          for p in files:
              s=p.read_text(encoding='ascii').strip()
              try:
                  b=base64.b64decode(s, validate=True)
              except Exception as e:
                  print('FIRST BAD:', p, 'len=', len(s), type(e).__name__, str(e))
                  break
              print('GOOD:', p, 'len=', len(s), 'decoded=', len(b), 'sha=', hashlib.sha256(b).hexdigest())
              good.append(b)
          packed=b''.join(good)
          print('PREFIX PACKED SIZE:', len(packed))
          d=lzma.LZMADecompressor()
          raw=d.decompress(packed)
          print('PREFIX RAW SIZE:', len(raw), 'eof=', d.eof)
          print('RAW HEAD REPR:', repr(raw[:1000]))
          print('RAW TAIL REPR:', repr(raw[-1000:]))
          try:
              print('RAW HEAD TEXT:', raw[:2000].decode('utf-8'))
          except Exception as e:
              print('RAW NOT UTF8:', type(e).__name__, str(e))
          PY
