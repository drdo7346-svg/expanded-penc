name: Export Existing PenC Source

on:
  push:
    paths:
      - '.github/workflows/export-existing-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore prior successful source from Git object tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TREE: 59a5d2606ad214dcea9ccee3b86d85460c82435a
          SOURCE_SHA256: fea40c9e2cc88063c02397904a7f2401577b488f7682e03022e73f48b8f5fe44
        run: |
          python - <<'PY'
          import os, json, base64, lzma, hashlib, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          tree_sha=os.environ['SOURCE_TREE']
          expected=os.environ['SOURCE_SHA256']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'penc-source-export',
          }
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          tree=get_json(f'https://api.github.com/repos/{repo}/git/trees/{tree_sha}?recursive=1')
          blobs={x['path']:x['sha'] for x in tree['tree'] if x.get('type')=='blob'}
          names=['src/source_payload.b64']+[f'src/cont{i:03}.b64' for i in range(14)]
          pieces=[]
          for name in names:
              obj=get_json(f"https://api.github.com/repos/{repo}/git/blobs/{blobs[name]}")
              pieces.append(base64.b64decode(obj['content']).decode('ascii').strip())
          raw=lzma.decompress(base64.b64decode(''.join(pieces)))
          actual=hashlib.sha256(raw).hexdigest()
          print('SOURCE SIZE:',len(raw))
          print('SOURCE SHA256:',actual)
          if actual != expected:
              raise SystemExit(f'Source SHA mismatch: {actual}')
          pathlib.Path('existing_penc_source.py').write_bytes(raw)
          PY
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: existing-penc-source
          path: existing_penc_source.py
          if-no-files-found: error
          retention-days: 1
