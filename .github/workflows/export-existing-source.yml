name: Export Existing PenC Source

on:
  push:
    paths:
      - '.github/workflows/export-existing-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final editor payload branch
        uses: actions/checkout@v4
        with:
          ref: build-final-editor-v9
      - name: Diagnose final delta payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          files = sorted(Path('delta_parts').glob('part*.b64')) + sorted(Path('delta_tail').glob('tail*.b64'))
          print('FILES:', [str(p) for p in files])
          joined = ''.join(p.read_text(encoding='ascii').strip() for p in files)
          print('B64 CHARS:', len(joined))
          packed = base64.b64decode(joined)
          print('PACKED SIZE:', len(packed))
          print('PACKED SHA256:', hashlib.sha256(packed).hexdigest())
          print('PACKED HEAD:', packed[:32].hex())
          raw = lzma.decompress(packed)
          print('RAW SIZE:', len(raw))
          print('RAW SHA256:', hashlib.sha256(raw).hexdigest())
          print('RAW HEAD REPR:', repr(raw[:500]))
          print('RAW TAIL REPR:', repr(raw[-500:]))
          try:
              txt = raw.decode('utf-8')
              print('UTF8: YES')
              print('FIRST LINES:')
              print('\n'.join(txt.splitlines()[:20]))
          except Exception as e:
              print('UTF8: NO', type(e).__name__, str(e))
          Path('final_delta_raw.bin').write_bytes(raw)
          PY
      - name: Upload raw delta
        uses: actions/upload-artifact@v4
        with:
          name: final-delta-raw
          path: final_delta_raw.bin
          if-no-files-found: error
          retention-days: 1
