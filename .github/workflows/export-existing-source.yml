name: Export Existing PenC Source

on:
  push:
    paths:
      - '.github/workflows/export-existing-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final editor payload branch
        uses: actions/checkout@v4
        with:
          ref: build-final-editor-v9
      - name: Try boundary repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          parts=[p.read_text(encoding='ascii').strip() for p in sorted(Path('delta_parts').glob('part*.b64'))]
          tails=[p.read_text(encoding='ascii').strip() for p in sorted(Path('delta_tail').glob('tail*.b64'))]
          def dec(s): return base64.b64decode(s, validate=True)
          fixed={}
          for i,s in enumerate(parts):
              if i not in (5,10): fixed[i]=dec(s)
          p5c=[parts[5]+'=', parts[5][:-1]+'==', parts[5][1:]+'==']
          p10c=[parts[10][:-5], parts[10][5:]]
          for a,p5s in enumerate(p5c):
              try: p5=dec(p5s)
              except Exception as e:
                  print('P5 candidate',a,'decode fail',e); continue
              for b,p10s in enumerate(p10c):
                  try: p10=dec(p10s)
                  except Exception as e:
                      print('P10 candidate',b,'decode fail',e); continue
                  blobs=[]
                  for i in range(len(parts)):
                      blobs.append(p5 if i==5 else p10 if i==10 else fixed[i])
                  try:
                      blobs += [dec(x) for x in tails]
                      packed=b''.join(blobs)
                      raw=lzma.decompress(packed)
                      print('SUCCESS',a,b,'packed',len(packed),hashlib.sha256(packed).hexdigest(),'raw',len(raw),hashlib.sha256(raw).hexdigest())
                      Path('final_delta_raw.bin').write_bytes(raw)
                      raise SystemExit(0)
                  except lzma.LZMAError as e:
                      print('candidate',a,b,'lzma fail',e)
          raise SystemExit('No simple boundary repair worked')
          PY
      - name: Upload repaired delta
        uses: actions/upload-artifact@v4
        with:
          name: final-delta-raw
          path: final_delta_raw.bin
          if-no-files-found: error
          retention-days: 1
