name: Export Existing PenC Source

on:
  push:
    paths:
      - '.github/workflows/export-existing-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct existing source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          parts = sorted(Path('source_parts').glob('part*.b64'))
          if not parts:
              raise SystemExit('No source_parts found')
          joined = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          raw = lzma.decompress(base64.b64decode(joined))
          Path('existing_penc_source.py').write_bytes(raw)
          print('parts:', len(parts))
          print('size:', len(raw))
          print('sha256:', hashlib.sha256(raw).hexdigest())
          PY
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: existing-penc-source
          path: existing_penc_source.py
          if-no-files-found: error
          retention-days: 1
