name: Verify Existing PenC Final Patch

on:
  push:
    paths:
      - '.github/workflows/export-existing-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified patch payload
        uses: actions/checkout@v4
        with:
          ref: final-editor-payload-clean

      - name: Verify and reconstruct final source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TREE: 59a5d2606ad214dcea9ccee3b86d85460c82435a
          OLD_SHA256: fea40c9e2cc88063c02397904a7f2401577b488f7682e03022e73f48b8f5fe44
          NEW_SHA256: 78902cd23df548c1cd2d305d653cf1ad49abd7c340255763e8f06036aa28fbc9
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, json, os, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'penc-verify-final-patch',
          }
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          tree=get_json(f"https://api.github.com/repos/{repo}/git/trees/{os.environ['SOURCE_TREE']}?recursive=1")
          blobs={x['path']:x['sha'] for x in tree['tree'] if x.get('type')=='blob'}
          names=['src/source_payload.b64']+[f'src/cont{i:03}.b64' for i in range(14)]
          pieces=[]
          for name in names:
              obj=get_json(f"https://api.github.com/repos/{repo}/git/blobs/{blobs[name]}")
              pieces.append(base64.b64decode(obj['content']).decode('ascii').strip())
          old=lzma.decompress(base64.b64decode(''.join(pieces)))
          old_sha=hashlib.sha256(old).hexdigest()
          print('OLD SIZE',len(old),'SHA',old_sha)
          if old_sha != os.environ['OLD_SHA256']:
              raise SystemExit('old source mismatch')

          files=sorted(Path('verified_patch').glob('p*.b64'))
          print('PATCH FILES',[(p.name,p.stat().st_size) for p in files])
          strings=[p.read_text(encoding='ascii').strip() for p in files]

          candidates=[]
          try:
              candidates.append(('joined-b64', base64.b64decode(''.join(strings), validate=True)))
          except Exception as e:
              print('joined-b64 decode failed',repr(e))
          try:
              candidates.append(('per-file-b64', b''.join(base64.b64decode(s,validate=True) for s in strings)))
          except Exception as e:
              print('per-file-b64 decode failed',repr(e))

          success=False
          for label,packed in candidates:
              print(label,'PACKED SIZE',len(packed),'SHA',hashlib.sha256(packed).hexdigest(),'HEAD',packed[:16].hex())
              raw_variants=[]
              try:
                  raw_variants.append(('lzma',lzma.decompress(packed)))
              except Exception as e:
                  print(label,'lzma failed',repr(e))
              raw_variants.append(('plain',packed))
              for rawlabel,raw in raw_variants:
                  print(label,rawlabel,'RAW SIZE',len(raw),'SHA',hashlib.sha256(raw).hexdigest(),'HEAD',repr(raw[:160]))
                  try:
                      obj=json.loads(raw.decode('utf-8'))
                  except Exception as e:
                      print(label,rawlabel,'json failed',repr(e))
                      continue
                  print('JSON TYPE',type(obj).__name__)
                  if isinstance(obj,dict):
                      print('JSON KEYS',sorted(obj.keys()))
                      print('OLD_SHA FIELD',obj.get('old_sha'))
                      print('NEW_SHA FIELD',obj.get('new_sha'))
                  else:
                      print('JSON PREVIEW',repr(obj)[:1000])

                  patch=obj
                  if not isinstance(patch,dict) or 'ops' not in patch:
                      continue
                  old_lines=old.decode('utf-8').splitlines(keepends=True)
                  out=[]
                  for op in patch['ops']:
                      if op[0]=='c':
                          start,count=int(op[1]),int(op[2])
                          out.extend(old_lines[start:start+count])
                      elif op[0]=='i':
                          out.append(op[1])
                      else:
                          raise SystemExit(f'unknown op {op[0]!r}')
                  new=''.join(out).encode('utf-8')
                  sha=hashlib.sha256(new).hexdigest()
                  print('RECONSTRUCTED SIZE',len(new),'SHA',sha)
                  if sha==os.environ['NEW_SHA256']:
                      Path('PenC_Expansion_Editor_FINAL.py').write_bytes(new)
                      print('VERIFIED FINAL SOURCE')
                      success=True
                      break
              if success:
                  break
          if not success:
              raise SystemExit('verified_patch did not reconstruct expected final source')
          PY

          python -m py_compile PenC_Expansion_Editor_FINAL.py

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: PenC_Expansion_Editor_FINAL_verified_source
          path: PenC_Expansion_Editor_FINAL.py
          if-no-files-found: error
          retention-days: 1
