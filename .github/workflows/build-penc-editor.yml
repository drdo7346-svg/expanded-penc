name: Build PenC Expansion Editor EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'PenC_Expansion_Editor_FINAL.py'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Verify source
        shell: pwsh
        run: |
          if (-not (Test-Path 'PenC_Expansion_Editor_FINAL.py')) {
            throw 'PenC_Expansion_Editor_FINAL.py is missing from repository root.'
          }
          python -m py_compile PenC_Expansion_Editor_FINAL.py

      - name: Install Nuitka dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow nuitka ordered-set zstandard
          python -m nuitka --version

      - name: Build Windows x64 onefile EXE
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=onefile `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=PIL `
            --assume-yes-for-downloads `
            --lto=yes `
            --output-dir=dist `
            --output-filename=PenC_Expansion_Editor_FINAL.exe `
            PenC_Expansion_Editor_FINAL.py

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist\PenC_Expansion_Editor_FINAL.exe'
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) {
            throw "EXE unexpectedly small: $($item.Length) bytes"
          }
          $fs = [IO.File]::OpenRead($exe)
          try {
            $b0 = $fs.ReadByte()
            $b1 = $fs.ReadByte()
          }
          finally {
            $fs.Dispose()
          }
          if ($b0 -ne 0x4D -or $b1 -ne 0x5A) {
            throw 'Output is not a Windows MZ/PE executable.'
          }
          Write-Host "EXE SIZE: $($item.Length)"
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenC_Expansion_Editor_FINAL_Windows_x64
          path: dist/PenC_Expansion_Editor_FINAL.exe
          if-no-files-found: error
          retention-days: 30
