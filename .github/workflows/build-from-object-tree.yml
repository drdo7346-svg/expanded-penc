name: Build PenC EXE from exact object tree

on:
  push:
    branches: [build-stock-save-fix]
    paths:
      - ".github/workflows/build-from-object-tree.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Restore exact source from Git object tree
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TREE: 9a0b3b6fdb4576b0fc3e92750b080115a63f1f30
          SOURCE_SHA256: fea40c9e2cc88063c02397904a7f2401577b488f7682e03022e73f48b8f5fe44
        run: |
          @'
          import os, json, base64, lzma, hashlib, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; tree_sha=os.environ['SOURCE_TREE']; expected=os.environ['SOURCE_SHA256']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'penc-build'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: return json.load(r)
          tree=get_json(f'https://api.github.com/repos/{repo}/git/trees/{tree_sha}?recursive=1')
          blobs={x['path']:x['sha'] for x in tree['tree'] if x.get('type')=='blob'}
          names=['src/source_payload.b64']+[f'src/cont{i:03}.b64' for i in range(15)]
          pieces=[]
          for name in names:
              obj=get_json(f"https://api.github.com/repos/{repo}/git/blobs/{blobs[name]}")
              pieces.append(base64.b64decode(obj['content']).decode('ascii').strip())
          raw=lzma.decompress(base64.b64decode(''.join(pieces)))
          actual=hashlib.sha256(raw).hexdigest()
          print('SOURCE SIZE:',len(raw)); print('SOURCE SHA256:',actual)
          if actual != expected: raise SystemExit(f'Source SHA mismatch: {actual}')
          pathlib.Path('penc_editor.py').write_bytes(raw)
          '@ | Set-Content -Encoding UTF8 restore_source.py
          python restore_source.py

      - name: Syntax check
        run: python -m py_compile penc_editor.py

      - name: Install Nuitka dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow nuitka ordered-set zstandard
          python -m nuitka --version

      - name: Build Windows x64 onefile EXE
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=onefile `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=PIL `
            --assume-yes-for-downloads `
            --lto=yes `
            --output-dir=dist `
            --output-filename=PenC_Universal_Editor_STOCK_SAVE_FIX_Protected.exe `
            penc_editor.py

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe=Resolve-Path 'dist\PenC_Universal_Editor_STOCK_SAVE_FIX_Protected.exe'
          $item=Get-Item $exe
          if ($item.Length -lt 1000000) { throw "EXE unexpectedly small: $($item.Length)" }
          $fs=[IO.File]::OpenRead($exe)
          try { $b0=$fs.ReadByte(); $b1=$fs.ReadByte() } finally { $fs.Dispose() }
          if ($b0 -ne 0x4D -or $b1 -ne 0x5A) { throw 'Not MZ/PE' }
          Write-Host "EXE SIZE: $($item.Length)"
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenC_Universal_Editor_STOCK_SAVE_FIX_Nuitka_Windows_x64
          path: dist/PenC_Universal_Editor_STOCK_SAVE_FIX_Protected.exe
          if-no-files-found: error
          retention-days: 30
