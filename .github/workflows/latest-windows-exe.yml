name: Build latest PenC compact Windows EXE

on:
  push:
    branches: ['codex/windows-exe-20260913']
    paths: ['exe_build/**', '.github/workflows/latest-windows-exe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: 'x64'
      - name: Reconstruct and verify unchanged latest source
        run: python exe_build/scripts/prepare.py
      - name: Set up verified executable compressor
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win64.zip' -OutFile upx.zip
          $hash = (Get-FileHash upx.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda') { throw 'UPX checksum mismatch' }
          Expand-Archive upx.zip -DestinationPath build-tools
          "PENC_UPX_DIR=$((Resolve-Path 'build-tools/upx-5.2.1-win64').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Clean build environment with runtime dependencies only
        shell: pwsh
        run: |
          python -m venv build-venv
          ./build-venv/Scripts/python.exe -m pip install --disable-pip-version-check pyinstaller==6.20.0 pillow==12.1.1
          ./build-venv/Scripts/python.exe -m pip freeze > exe_build/dependencies.txt
      - name: Run source validation and build compressed one-file EXE
        shell: pwsh
        run: |
          ./build-venv/Scripts/python.exe exe_build/scripts/penc_editor.py --validate-release > exe_build/source-validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Source validation failed' }
          ./build-venv/Scripts/python.exe exe_build/scripts/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Verify every original code object and required runtime
        run: ./build-venv/Scripts/python.exe exe_build/scripts/audit_bundle.py
      - name: Upload executable after complete-code verification
        uses: actions/upload-artifact@v4
        with:
          name: PenC_Expansion_Editor_Windows_x64
          path: exe_build/dist/PenC_Expansion_Editor.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Test the actual Windows executable
        shell: pwsh
        run: |
          ./build-venv/Scripts/python.exe -m pip install --disable-pip-version-check psutil==7.2.2
          ./build-venv/Scripts/python.exe exe_build/scripts/smoke_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows EXE smoke test failed' }
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PenC_EXE_build_checks
          path: |
            exe_build/*.json
            exe_build/*.png
            exe_build/dependencies.txt
            exe_build/work/PenC_Expansion_Editor/warn-*.txt
          if-no-files-found: warn
          retention-days: 30

